name: Briefing Electoral

on:
  workflow_dispatch:         # ejecución manual desde GitHub
  repository_dispatch:       # ejecución desde cron-job.org
    types: [run-briefing]

jobs:
  generar-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install anthropic

      - name: Correr briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

        run: python3 briefing.py

      - name: Guardar memoria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memoria.json
          git diff --staged --quiet || git commit -m "actualizar memoria [skip ci]"
          git push
